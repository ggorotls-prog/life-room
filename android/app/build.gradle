plugins {
    id 'com.android.application'
}

// 서명 열쇠는 하나로 고정(2026-11-07, GitHub 비밀값). 새 apk는 지우지 않고 위에 덮어 깔면 되고, 접근성 설정도 그대로 남는다.
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'app.liferoom'
    compileSdk 35

    defaultConfig {
        applicationId 'app.liferoom'
        minSdk 29
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // 판 두 가지(2026-11-19): direct = 지금처럼 사이트에서 받아 까는 판(스스로 업데이트), play = 구글 플레이용 판(스스로 업데이트 없음)
    flavorDimensions 'dist'
    productFlavors {
        direct {
            dimension 'dist'
            manifestPlaceholders = [appLabel: '건강 기록']
        }
        // 지금 앱(app.liferoom)과 나란히 깔리게 이름표를 따로 둔다. 플레이에 올릴 이름표도 이것(2026-11-19 룡 「건강기록(스토어)」)
        play {
            dimension 'dist'
            applicationId 'app.liferoom.store'
            manifestPlaceholders = [appLabel: '건강 기록(스토어)']
        }
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'lifeapp'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true   // 직접 설치용 판의 Updater가 BuildConfig.VERSION_CODE로 새 버전을 비교한다
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 건강 기록 폰 기능 원본(취침 잠금·화면·알림). 라이프 RPG와 같이 쓴다
    implementation project(':healthkit')
}
