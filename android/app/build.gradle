plugins {
    id 'com.android.application'
}

// 서명 열쇠는 하나로 고정(2026-11-07, GitHub 비밀값). 새 apk는 지우지 않고 위에 덮어 깔면 되고, 접근성 설정도 그대로 남는다.
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'app.liferoom'
    compileSdk 35

    defaultConfig {
        applicationId 'app.liferoom'
        minSdk 29
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'lifeapp'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true   // Updater가 BuildConfig.VERSION_CODE로 새 버전을 비교한다
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 카메라로 찍은 사진 파일 넘겨받기(FileProvider)
    implementation 'androidx.core:core:1.13.1'
}
