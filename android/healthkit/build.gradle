// 건강 기록 폰 기능 원본 한 벌(2026-11-15 룡 「잠금 코드는 하나로 모으자」).
// 건강 기록 앱(app)과 라이프 RPG(🏠 집)가 이 모듈을 같이 쓴다. 라이프 RPG는 빌드 때 이 저장소를 받아 이 폴더를 가져다 쓴다.
// 여기를 고치면 두 앱이 같이 바뀐다: 건강 기록 앱은 올리자마자, 라이프 RPG는 15분 점검이 알아채 새 버전을 만든다(2026-11-15).
plugins {
    id 'com.android.library'
    // Health Connect(운동 알림, 2026-11-16)가 Kotlin 전용이라 HcReader.kt 하나만 Kotlin. 버전을 여기 적어 라이프 RPG 빌드에서도 그대로 받는다
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'app.recordkit.health'
    compileSdk 35

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // 카메라로 찍은 사진 파일 넘겨받기(FileProvider)
    api 'androidx.core:core:1.13.1'
    // 구글 로그인을 크롬 창(Custom Tab)으로 열기(2026-11-26). 앱 안 화면에서는 구글이 로그인을 막는다
    implementation 'androidx.browser:browser:1.8.0'
    // 삼성 헬스 → Health Connect 운동 읽기. 1.1.0 정식판은 compileSdk 36·AGP 8.9가 필요해서 지금 빌드(35·8.7.3)에 맞는 판
    implementation 'androidx.health.connect:connect-client:1.1.0-beta01'
}