// 건강 기록 폰 기능 원본 한 벌(2026-11-15 룡 「잠금 코드는 하나로 모으자」).
// 건강 기록 앱(app)과 라이프 RPG(🏠 집)가 이 모듈을 같이 쓴다. 라이프 RPG는 빌드 때 이 저장소를 받아 이 폴더를 가져다 쓴다.
// 여기를 고치면 두 앱이 같이 바뀐다: 건강 기록 앱은 올리자마자, 라이프 RPG는 15분 점검이 알아채 새 버전을 만든다(2026-11-15).
plugins {
    id 'com.android.library'
}

android {
    namespace 'app.recordkit.health'
    compileSdk 35

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 카메라로 찍은 사진 파일 넘겨받기(FileProvider)
    api 'androidx.core:core:1.13.1'
}