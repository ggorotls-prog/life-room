<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>🌱 건강 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://trlnatdkebjvgiqneulv.supabase.co" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 기록 앱 공통 바탕(브랜드 가이드 「기록 앱 화면」, 2026-11-11): 바탕·카드·글자·선·글꼴은 네 기록 앱이 같고, 포인트 색(--main)만 앱마다 다르다. */
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f1f1d; --sub: #6b6a64; --line: #e4e2db; --fill: #eceae4;
    --main: #2f7d5b; --main-ink: #ffffff; --main-soft: #e4f2ea; --sun: #f5a524; --err: #d62d1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #22221f; --ink: #ecebe6; --sub: #a3a29b; --line: #34332f; --fill: #2e2d29;
      --main: #7cc7a2; --main-ink: #10201b; --main-soft: #1f2e27; --sun: #f0b350; --err: #ff6454; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; font-weight: 500; font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }
  /* 태블릿·PC는 넓게(2026-11-20 룡), 폰(768px 아래)은 그대로 */
  @media (min-width: 768px) { #app, .tabs div { max-width: 720px; } .wk { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (min-width: 1100px) { #app, .tabs div { max-width: 960px; } }
  h1 { font-size: 24px; font-weight: 900; margin: 0 0 4px; }
  h2 { font-size: 17px; font-weight: 900; margin: 24px 0 10px; }
  p { margin: 0; }
  .sub { color: var(--sub); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px; min-height: 48px; padding: 0 16px; background: var(--main-soft); color: var(--main); }
  button.main { background: var(--main); color: var(--main-ink); width: 100%; font-size: 17px; min-height: 56px; }
  button:disabled { opacity: .5; }
  input, select { font: inherit; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
  select { font-size: 20px; font-weight: 700; text-align: center; }
  label.f { display: block; margin-top: 12px; font-size: 14px; font-weight: 700; }
  label.f input { margin-top: 4px; }
  .err { color: var(--err); font-size: 14px; margin-top: 10px; min-height: 20px; }
  /* 오류가 없을 때는 빈 칸을 접어 버튼을 위 칸에 붙인다(2026-11-24 룡: 고치기·적용점 저장 버튼이 동떨어짐) */
  #bedBox .err:empty, #fbErr:empty, #exErr:empty { min-height: 0; margin-top: 0; }
  #bedBox .err:empty + button.main, #fbErr:empty + button.main, #exErr:empty + button.main { margin-top: 12px; }
  .switch { color: var(--main); background: none; width: 100%; font-size: 14px; margin-top: 4px; }
  .consent { background: var(--main-soft); border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
  .consent ul { margin: 6px 0 0; padding-left: 18px; }
  .ask { text-align: center; padding-top: 32px; }
  .ask .big { font-size: 56px; line-height: 1.1; }
  .ask h1 { margin-top: 12px; }
  .ask .card { margin-top: 20px; text-align: left; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .slots button { min-height: 48px; padding: 0 4px; font-size: 14px; }
  .slots button.on { background: var(--main); color: var(--main-ink); }
  .supp5 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .supp5 button { background: var(--card); border: 1px solid var(--line); min-height: 56px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.2; }
  .supp5 button b { font-size: 13px; white-space: normal; word-break: keep-all; } .supp5 button small { font-size: 11px; font-weight: 600; word-break: keep-all; }
  .supp5 button.on { background: #c9822b; border-color: #c9822b; color: #fff; }
  /* 오늘 끼니 버튼: 아침·점심·저녁이 한눈에 보이게 그림+이름 두 줄, 흰 바탕 테두리, 먹은 끼니는 진한 초록(2026-11-20 룡) */
  .slots.meal button { min-height: 62px; background: var(--card); border: 1.5px solid var(--line); color: var(--ink); font-weight: 700; line-height: 1.25; }
  .slots.meal button b { display: block; font-size: 20px; }
  .slots.meal button.on, .slots.meal button.on:disabled { background: var(--main); color: var(--main-ink); border-color: var(--main); opacity: 1; }
  /* 한 주 보고·피드백(2026-11-20 룡) */
  .wk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
  .wk div { min-width: 0; } .wk small { display: block; color: var(--sub); font-size: 12px; } .wk b { font-size: 17px; }
  .wk-why { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .wk-why li { padding: 4px 0; border-top: 1px solid var(--line); }
  textarea.fb { font: inherit; width: 100%; min-height: 72px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); resize: vertical; box-sizing: border-box; }
  .fb-pin { background: var(--main-soft); border: 1.5px solid var(--main); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .fb-pin .t { font-size: 12px; color: var(--sub); } .fb-pin p { margin: 4px 0 0; font-weight: 700; white-space: pre-wrap; word-break: break-word; }
  .fb-pin details { margin-top: 6px; font-size: 13px; } .fb-pin details div { padding: 4px 0; border-top: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
  .meal-chk { white-space: nowrap; font-size: 12px; letter-spacing: -0.5px; }
  .meal-chk span { color: var(--line); } .meal-chk span.y { color: var(--main); font-weight: 700; }
  .list { margin-top: 8px; font-size: 14px; }
  .list div { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .list div:first-child { border-top: 0; }
  .list .t { color: var(--sub); white-space: nowrap; }
  .exbox { display: flex; gap: 6px; margin-top: 10px; }
  .exbox input { min-height: 48px; }
  .exbox button { white-space: nowrap; }
  .why { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .why button { min-height: 48px; font-size: 14px; }
  .mo-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .mo-row .txt { flex: 1; } .mo-row .txt small { display: block; color: var(--sub); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .mo-row button { min-height: 40px; white-space: nowrap; }
  .mo-times { display: grid; grid-template-columns: 3em 1fr auto 1fr; gap: 6px; align-items: center; margin-top: 8px; font-size: 14px; }
  .mo-times select { min-height: 40px; padding: 0 6px; }
  .why-td { font-size: 11px; color: var(--sub); white-space: nowrap; }
  .faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .faces button { background: var(--fill); font-size: 26px; padding: 0; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .faces button small { font-size: 12px; font-weight: 700; }
  .faces button.on { background: var(--main-soft); outline: 2px solid var(--main); }
  .week { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .week b { font-size: 22px; font-weight: 900; white-space: nowrap; }
  .bar { flex: 1; height: 12px; border-radius: 6px; background: var(--fill); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--main); transition: width .3s; }
  .checks { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 16px; }
  .wdots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 10px; }
  .wdots .wd { background: none; padding: 0; min-height: 48px; font-size: 13px; font-weight: 700; color: var(--sub); border-radius: 8px; opacity: 1; }
  .wdots .wd i { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin: 0 auto 2px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); font-style: normal; font-size: 15px; color: var(--main-ink); }
  .wdots .wd.on i { background: var(--main); border-color: var(--main); }
  .wdots .wd.td i { border-width: 2.5px; border-color: var(--sun); }
  .wdots .wd.ft { opacity: .45; }
  .slots.meal button.fast, .slots.meal button.fast:disabled { background: #3d6fb5; border-color: #3d6fb5; color: #fff; opacity: 1; }
  #bedBox:empty { display: none; }
  #bedBox > .card { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; padding: 14px 0 4px; margin-top: 12px !important; }
  .gcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 359px) { .gcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .gcard { position: relative; min-height: 64px; padding: 8px 6px; background: var(--card); border: 1.5px solid var(--line); color: var(--ink); line-height: 1.3; overflow-wrap: anywhere; }
  .gcard b { display: block; font-size: 14px; }
  .gcard small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); }
  .gcard.on { border-color: var(--main); background: var(--main-soft); }
  .galert { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--err); color: #fff; font-size: 13px; font-style: normal; font-weight: 900; line-height: 22px; text-align: center; }
  .gwarn { background: #fdecec; color: #8f1d1d; border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 14px; line-height: 1.6; }
  .gwarn b { display: block; margin-bottom: 2px; }
  .thru { background: var(--main-soft); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; text-align: center; font-size: 15px; line-height: 1.4; }
  .thru span { display: block; } .thru b { font-size: 26px; color: var(--main); }
  .backb { width: auto; margin: 0 0 8px; padding: 6px 12px; font-size: 14px; background: var(--card); border: 1.5px solid var(--line); color: var(--ink); }
  .mem { border-top: 1px solid var(--line); padding: 12px 0; }
  .mem:first-child { border-top: 0; }
  .mem-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .mem-h b { font-size: 16px; overflow-wrap: anywhere; } .mem-h small { color: var(--sub); font-size: 12px; font-weight: 400; }
  .mem-h button { width: auto; margin: 0; font-size: 12px; padding: 4px 8px; flex: none; }
  .mem-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .mem-sum > div { background: var(--fill); border-radius: 10px; padding: 6px 4px; text-align: center; min-width: 0; }
  .mem-sum small { display: block; font-size: 11px; color: var(--sub); } .mem-sum b { font-size: 13px; display: block; }
  .mem-sum .cbtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
  .mem-sum .cbtn { width: auto; margin: 0; font-size: 12px; padding: 1px 3px; min-height: 0; border-radius: 6px; background: var(--card); border: 1px solid var(--line); color: var(--ink); line-height: 1.3; }
  .mem-why { margin-top: 6px; background: var(--fill); border-radius: 8px; padding: 6px 10px; font-size: 14px; overflow-wrap: anywhere; }
  .mem details { margin-top: 8px; } .mem summary { font-size: 13px; color: var(--sub); cursor: pointer; }
  .mem .scroll { overflow-x: auto; }
  .codeRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--fill); border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
  .codeRow .code { font-family: monospace; font-size: 18px; font-weight: 800; letter-spacing: .08em; }
  .codeRow button { width: auto; margin: 0; font-size: 13px; padding: 6px 10px; }
  .check { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 68px; }
  .check .ico { font-size: 28px; }
  .check .txt { flex: 1; min-width: 0; }
  .check .txt strong { display: block; font-weight: 900; }
  .check.done { background: var(--main-soft); border-color: var(--main); }
  .check button:not(:where(#bedBox button)) { min-height: 44px; padding: 0 12px; font-size: 14px; white-space: nowrap; }
  .check .btns { display: flex; gap: 6px; }
  .check .pick { background: var(--main); color: var(--main-ink); }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row.mine .nm { font-weight: 900; color: var(--main); }
  .dots { font-size: 18px; letter-spacing: 2px; white-space: nowrap; }
  /* 서로 응원·연속 기록·에너지(2026-11-19) */
  .fire { font-size: 13px; font-weight: 700; color: var(--sun); margin-left: 4px; white-space: nowrap; }
  .en { font-size: 13px; font-weight: 700; color: var(--sun); margin-left: 6px; white-space: nowrap; }
  .cheer { display: flex; align-items: center; gap: 10px; padding: 0 14px 12px; }
  .cheer button { min-height: 40px; padding: 0 14px; background: var(--card); border: 1.5px solid var(--main); color: var(--main); } /* 누르기 전도 또렷하게(2026-11-24 아내 요청) */
  .cheer button.on { background: var(--main); color: var(--main-ink); }
  .got { background: var(--main-soft); border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; font-size: 15px; }
  /* 「오늘 우리 조」 한눈에 아이콘(2026-11-20) */
  .dots.icons { display: flex; gap: 6px; letter-spacing: 0; }
  .consent p { margin: 6px 0 4px; font-size: 15px; }
  .consent details { margin: 4px 0 8px; font-size: 14px; }
  .consent summary { cursor: pointer; color: var(--main); font-weight: 700; padding: 6px 0; }
  .consent .ck { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 15px; font-weight: 700; }
  .consent .ck input { width: 24px; height: 24px; flex: none; margin: 0; }
  .consent .ck span { flex: 1; }
  .pi { position: relative; width: 30px; height: 30px; display: inline-block; }
  .pi svg { display: block; }
  .pi i { position: absolute; left: 0; top: 0; width: 30px; height: 30px; line-height: 30px; text-align: center; font-size: 13px; font-style: normal; }

  .post { padding: 0; overflow: hidden; margin-bottom: 12px; }
  .post .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
  .post .head .nm { flex: 1; font-weight: 900; overflow-wrap: anywhere; }
  .post img { display: block; width: 100%; }
  .post img.ex { max-height: 240px; object-fit: cover; } /* 운동 사진은 낮게 잘라서(2026-11-24 룡) */
  .exthumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
  .exnote { display: block; color: var(--ink); overflow-wrap: anywhere; }
  .exphoto img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; }
  .exphoto a { display: inline-block; margin-top: 6px; font-size: 14px; }
  .post .del { background: none; color: var(--sub); min-height: 36px; padding: 0 4px; font-size: 13px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { color: var(--sub); font-size: 12px; text-align: center; padding: 4px 2px; }
  .tbl td { text-align: center; padding: 8px 2px; border-top: 1px solid var(--line); }
  [hidden] { display: none !important; }
  /* ☰ 계정 창: 업무 기록·영성 기록과 같은 모양(2026-11-02 룡: 기본 화면 통일) */
  #menuBtn { position: absolute; top: 8px; right: 10px; z-index: 5; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; min-height: 36px; padding: 0 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .am-bg { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .am { max-height: 100%; overflow-y: auto; width: 100%; max-width: 360px; background: var(--card); color: var(--ink); border-radius: 18px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .am-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 12px; }
  .am-head strong { font-size: 17px; }
  .am-x { background: none; color: var(--sub); font-size: 18px; width: 36px; min-height: 36px; padding: 0; }
  .am-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; margin-top: 8px; padding: 14px 16px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
  .am-item small { color: var(--sub); font-size: 12px; font-weight: 400; }
  .am-item .am-go { color: var(--sub); font-size: 18px; font-weight: 400; }
  .am-item.danger { color: var(--err); }
  .am-back { background: none; color: var(--sub); font-size: 14px; min-height: 32px; padding: 4px 2px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabs div { max-width: 480px; margin: 0 auto; display: flex; }
  .tabs button { flex: 1; background: none; color: var(--sub); border-radius: 0; min-height: 60px; padding: 0; font-size: 13px; }
  .tabs button.on { color: var(--main); font-weight: 900; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  .loading { text-align: center; color: var(--sub); padding: 48px 0; }
  a.btn { display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; border-radius: 12px; min-height: 48px; margin-top: 10px; background: var(--main-soft); color: var(--main); }
  .tbl tr[data-day] { cursor: pointer; }
  .tbl tr[data-day] td:first-child { color: var(--main); text-decoration: underline; }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div id="tabs"></div>
<button id="menuBtn" aria-label="내 계정" hidden><span id="myName"></span> ☰</button>
<div class="am-bg" id="askBg" role="alertdialog" aria-modal="true" aria-labelledby="askMsg" style="z-index:30" hidden>
  <div class="am" style="max-width:320px;text-align:center;padding:22px 16px 16px">
    <p id="askMsg" style="margin:0 0 18px;font-size:16px;font-weight:700;line-height:1.5;white-space:pre-line"></p>
    <div style="display:flex;gap:8px"><button type="button" id="askNo" style="flex:1">취소</button><button type="button" id="askYes" class="main" style="flex:1;margin:0">확인</button></div>
  </div>
</div>
<div class="am-bg" id="amBg" role="dialog" aria-modal="true" aria-labelledby="amName" hidden>
  <div class="am">
    <div class="am-head"><strong id="amName"></strong><button type="button" class="am-x" id="amClose" aria-label="닫기">✕</button></div>
    <div id="amMain">
      <button type="button" class="am-item" id="amSet"><span>⚙️ 설정</span><span class="am-go">›</span></button>
      <button type="button" class="am-item danger" id="amOut"><span>로그아웃</span><small>이 앱의 모든 기기에서 나가져요</small></button>
    </div>

function pieIcon(parts, color, label) {
  /* parts = [true/false…] 12시부터 시계 방향으로 조각을 채운다. 2조각이면 왼쪽·오른쪽 반 */
  const n = parts.length, R = 13, C = 15;
  const pt = a => (C + R * Math.sin(a)).toFixed(2) + ' ' + (C - R * Math.cos(a)).toFixed(2);
  const start = n === 2 ? Math.PI : 0;
  const segs = parts.map((on, i) => {
    const a0 = start + i * 2 * Math.PI / n, a1 = start + (i + 1) * 2 * Math.PI / n, c = Array.isArray(color) ? color[i] : color;
    return `<path d="M${C} ${C} L${pt(a0)} A${R} ${R} 0 ${n === 1 ? 1 : 0} 1 ${pt(a1 - (n === 1 ? 0.001 : 0))} Z" fill="${on ? c : 'var(--fill)'}"${n === 1 ? '' : ' stroke="var(--card)" stroke-width="1.5"'}/>`;
  }).join('');
  return `<svg class="pie" viewBox="0 0 30 30" width="30" height="30" role="img" aria-label="${label}">${segs}<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1"/></svg>`;
}

    + `<span class="pi">${pieIcon([b.wake, b.bed], ['var(--sun)', '#2b3a67'], '기상 ' + yn(b.wake) + ', 취침 ' + yn(b.bed))}<i>${b.wake && !b.bed ? '☀️' : b.bed ? '🌙' : '💤'}</i></span>`
    + `<span class="pi">${pieIcon(MEAL3.map(([k]) => has(meals, k)), 'var(--main)', '식단 ' + meals.length + '/3')}<i>🥗</i></span>`
    + (isCamp ? `<span class="pi">${pieIcon(SUPP5.map(([k]) => has(supps, k)), '#c9822b', '영양제 ' + supps.length + '/' + SUPP5.length)}<i>💊</i></span>` : '');

async function act(fn, args, cheer) {
  const go = document.getElementById('go');
  if (go) go.disabled = true;
  try {
    const had = !!(state && state.day), before = doneCount(state); /* 로그인처럼 앞 상태가 없을 때는 축하하지 않는다 */
    state = await rpc(fn, args);
    historyItems = []; historyDone = false;
    if (had && before < 3 && doneCount(state) === 3) toast('🎉 오늘 완성! 운동·식단·수면 3개를 다 채웠어요');
    else if (cheer) toast(cheer);
    render();
    return true;
  } catch (x) {
    const err = document.getElementById('err');
    if (err) err.textContent = x.message; else toast(x.message);
    if (go) go.disabled = false;
    return false;
  }
}

/* 사진: 줄이면서 위치 정보가 함께 사라진다 */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let size = 800, q = .7, data = '';
      for (let i = 0; i < 5; i++) {
        const k = Math.min(1, size / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', q);
        if (data.length < 390000) return resolve(data);
        size *= .8; q -= .1;
      }
      reject(new Error('사진이 너무 커요.'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요.')); };
    img.src = url;
  });
}

    <div class="card" style="margin-top:16px"><b>🔑 조 코드 넣기</b><p class="sub" style="margin:4px 0 8px">조장에게 받은 조 코드를 넣으면 그 조에 바로 들어가요.</p>
      <div class="exbox"><input id="rjCode" maxlength="12" placeholder="조 코드" autocomplete="off" style="text-transform:uppercase"><button class="pick" id="rjGo" type="button">들어가기</button></div><div class="err" id="rjErr"></div></div>`;
  /* 내가 조장인 조 칸 = 그 조 화면으로 넘어간다. 조원인 조 칸 = 아래에 오늘 모습을 편다(2026-11-24 룡) */
  $app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const c = cards.find(x => x.key === b.dataset.g);
    if (c && c.role === 'leader') { manageKey = c.key; goTab('leader'); return; }
    groupOpen = groupOpen === b.dataset.g ? null : b.dataset.g; paintGroups(); if (groupOpen) byId('gDetail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  if (!social) loadSocial();
  const rj = byId('rjGo');
  if (rj) rj.onclick = async () => {
    const code = byId('rjCode').value.trim();
    if (!code) { byId('rjErr').textContent = '조 코드를 넣어 주세요.'; return; }
    rj.disabled = true;
    try { state = await rpc('life_rejoin', { p_token: token, p_code: code }); historyItems = []; historyDone = false; toast('조에 들어갔어요 🌱'); groupOpen = null; renderGroup(); }
    catch (x) { byId('rjErr').textContent = x.message; rj.disabled = false; }
  };
}
async function renderGroup() {
  if (groupsView) paintGroups(); else $app.innerHTML = '<div class="loading">불러오는 중…</div>';
  const seq = screenSeq, tk = token;
  try { const v = await rpc('life_groups_view', { p_token: token }); if (tab !== 'group' || seq !== screenSeq || tk !== token) return; groupsView = v; paintGroups(); }
  catch (x) { if (token && tab === 'group' && seq === screenSeq && !groupsView) $app.innerHTML = `<p class="err">${esc(x.message)}</p>`; }
}
function goTab(k) {
  if (k !== tab && tab !== 'leader') tabTrail.push(tab); /* 조 화면에서 나갈 때는 뒤로 가기 기록에 넣지 않는다(다시 들어가지 않게) */
  tab = k; window.scrollTo(0, 0);
  if (tab === 'today' || tab === 'group') refresh().catch(x => toast(x.message)); else render();
}
/* 아래 버튼 3개(2026-11-24 룡 「탭 5개는 많다」): 기록 · 히스토리 · 조. 「내 한 주」는 기록 안, 「조원 살피기」는 조 안 */
function renderTabs() {
  const items = [['today', '기록'], ['history', '히스토리'], ['group', '조']];
  const on = tab === 'mine' ? 'today' : tab === 'leader' ? 'group' : tab;
  $tabs.innerHTML = `<div class="tabs"><div>${items.map(([k, n]) => `<button data-tab="${k}" class="${on === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>`;
  $tabs.querySelectorAll('button').forEach(b => b.onclick = () => goTab(b.dataset.tab));
}
let screenSeq = 0;
function render() {
  screenSeq++;
  byId('myName').textContent = state.me.nickname; byId('menuBtn').hidden = false;
  tellPhone();
  if (state.me.must_change_pw) forcePw();
  if (state.need === 'bed_yesterday') return renderBedYesterday();
  if (state.need === 'wake') return renderWake();
  if (state.day && state.day.bed && store.get('life_awake') !== state.today) return renderSleeping();
  /* 자는 중이 아닌데 잠금이 남아 있으면 푼다(취침 기록을 지웠거나 날이 바뀐 경우) */
  if (store.get('life_lock') === '1') { unlockAsked = false; unlockPhone(); }
  renderTabs();
  if (tab === 'history') return renderHistory();
  if (tab === 'mine') return renderMine();
  if (tab === 'leader') return renderLeader();
  if (tab === 'group') return renderGroup();
  renderToday();
}
async function refresh() {
  state = await rpc('life_state', { p_token: token });
  historyItems = []; historyDone = false;
  render();
}
/* 새 버전 알아차리기(2026-11-06 룡: 앱이 옛 화면을 계속 보여 줌). 앱으로 돌아올 때마다 서버의 파일 표식을 보고 바뀌었으면 새로 연다 */
let siteTag = null;
async function siteVersion() {
  try { const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }); return r.headers.get('etag') || r.headers.get('last-modified'); }
  catch (e) { return null; }
}
siteVersion().then(t => { siteTag = t; });
/* 폰에 저장된 옛 파일로 열렸는지 확인(2026-11-24 룡 「새 화면이 안 보이네」): 내가 받은 파일의 날짜가 서버 것과 다르면
   주소 뒤에 표식을 붙여 서버에서 새로 받는다. 같은 표식으로는 한 번만 한다(되풀이 막기) */
async function freshCheck() {
  try {
    const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
    const lm = Date.parse(r.headers.get('last-modified') || ''), mine = Date.parse(document.lastModified);
    const tag = r.headers.get('etag') || String(lm);
    if (!lm || !mine || Math.abs(lm - mine) < 5000 || store.get('life_fresh') === tag) return false;
    store.set('life_fresh', tag);
    location.replace(location.pathname + '?v=' + Date.now());
    return true;
  } catch (e) { return false; }
}
freshCheck();
async function checkNewSite() {
  const t = await siteVersion();
  if (t && siteTag && t !== siteTag && !document.getElementById('go')) { store.set('life_fresh', t); location.replace(location.pathname + '?v=' + Date.now()); return true; }
  if (!document.getElementById('go') && await freshCheck()) return true;
  if (t && !siteTag) siteTag = t;
  return false;
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !token || !state) return;
  if (await checkNewSite()) return;
  if (state.today !== seoulToday()) { tab = 'today'; refresh().catch(() => {}); return; }
  if ((tab === 'today' || tab === 'group') && !document.getElementById('go') && !document.getElementById('exGo') && !askDone) refresh().catch(() => {}); /* 확인창이 떠 있으면 다시 그리지 않는다 */
});

/* ☰ 계정 창. 로그아웃은 이 앱의 모든 기기에서, 비밀번호를 바꾸면 모든 기록에서 나간다 */
/* 처음 비밀번호면 바꾸기 전에는 닫히지 않는다(업무·영성 기록과 같음) */
let pwForced = false;
function forcePw() {
  if (pwForced) return;
  pwForced = true;
  amView('pw'); byId('pwForm').reset(); byId('pwErr').textContent = '';
  byId('amName').textContent = state.me.nickname + '님';
  byId('amClose').hidden = byId('pwBack').hidden = true; byId('pwMust').hidden = false;
  byId('pwConsent').hidden = !state.me.need_consent;
  byId('pwGo').textContent = state.me.need_consent ? '동의하고 바꾸기' : '바꾸기';
  byId('amBg').hidden = false;
}
function unforcePw() {
  pwForced = false;
  byId('amClose').hidden = byId('pwBack').hidden = false; byId('pwMust').hidden = byId('pwConsent').hidden = true;
  byId('pwGo').textContent = '바꾸기';
}
function amView(v) { byId('amMain').hidden = v !== 'main'; byId('amSetView').hidden = v !== 'set'; byId('pwForm').hidden = v !== 'pw'; byId('delForm').hidden = v !== 'del'; byId('amMoView').hidden = v !== 'mo'; if (v === 'set') { byId('amMo').hidden = !hasMoments(); byId('amCamp').hidden = !(camp && camp.allowed); paintHeroItem(); if (!heroInfo && token) rpc('life_hero_info', { p_token: token }).then(r => { heroInfo = r; paintHeroItem(); }).catch(() => {}); } }
function paintHeroItem() { const b = byId('amHero'); b.hidden = !(heroInfo && heroInfo.rooms > 0); byId('amHeroTxt').textContent = '🏃 운동방에도 같이 넣기: ' + (heroInfo && heroInfo.link ? '켬' : '끔'); }
byId('menuBtn').onclick = () => { amView('main'); byId('amName').textContent = state.me.nickname + '님'; byId('amBg').hidden = false; };
byId('amClose').onclick = () => { byId('amBg').hidden = true; };
byId('askYes').onclick = () => { if (askDone) askDone(true); };
byId('askNo').onclick = () => { if (askDone) askDone(false); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && askDone) askDone(false); });
byId('askBg').onclick = e => { if (e.target === byId('askBg') && askDone) askDone(false); };
byId('amBg').onclick = e => { if (e.target === byId('amBg') && !pwForced) byId('amBg').hidden = true; };
// 앱의 뒤로 가기(2026-11-11 룡: 꺼지지 말고 전 단계로): 열린 계정 창 → 직전 탭 → 「오늘」 → 맨 위. 더 갈 데가 없을 때만 앱이 닫힌다.
const tabTrail = [];
window.appBack = () => {
  if (askDone) { askDone(false); return true; } /* 확인창이 떠 있으면 「아니오」로 닫는다 */
  if (!byId('amBg').hidden) {
    if (pwForced) return true; // 비밀번호를 꼭 바꿔야 할 때는 안 닫힌다
    if (!byId('pwForm').hidden || !byId('amMoView').hidden || !byId('delForm').hidden) amView('set'); else if (!byId('amSetView').hidden) amView('main'); else byId('amBg').hidden = true;
    return true;
  }
  if (!state || !token) return false;
  if (tab !== 'today') {
    tab = tabTrail.pop() || 'today'; if (tab === 'today') tabTrail.length = 0;
    window.scrollTo(0, 0);
    if (tab === 'today') refresh().catch(x => toast(x.message)); else render();
    return true;
  }
  if (window.scrollY > 200) { window.scrollTo({ top: 0, behavior: 'smooth' }); return true; }
  return false;
};
byId('amSet').onclick = () => amView('set');
byId('amMo').onclick = openMoments;
byId('amHero').onclick = async () => {
  const on = !(heroInfo && heroInfo.link);
  if (on && !await ask('내가 누른 「운동했어요」를 내가 속한 1단계 운동방(실명 명단)에도 같이 넣을까요?', '같이 넣기')) return;
  try { heroInfo = await rpc('life_set_hero_link', { p_token: token, p_on: on }); paintHeroItem(); toast(on ? '앞으로 운동방에도 같이 넣어요' : '이제 건강 기록에만 남겨요'); } catch (x) { toast(x.message); }
};
byId('amCamp').onclick = () => {
  byId('amBg').hidden = true; campEdit = true;
  if (tab === 'today' && byId('campBox')) { byId('campBox').innerHTML = ''; if (camp) campForm(byId('campBox')); else loadCamp(); byId('campBox').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  else goTab('today');
};
byId('moBack').onclick = () => amView('set');
byId('amBack').onclick = () => amView('main');
byId('pwBack').onclick = () => amView('set');
byId('amPw').onclick = () => { byId('pwForm').reset(); byId('pwErr').textContent = ''; amView('pw'); };
byId('amOut').onclick = async () => { await rpc('life_logout_all', { p_token: token }).catch(() => {}); logout(); };
byId('pwForm').onsubmit = async e => {
  e.preventDefault();
  byId('pwErr').textContent = '';
  if (byId('pwNew').value !== byId('pwNew2').value) { byId('pwErr').textContent = '새 비밀번호 두 칸이 서로 달라요.'; return; }
  const btn = e.submitter; btn.disabled = true;
  try {
    const nick = state.me.nickname;
    const d = await rpc('life_change_password', { p_token: token, p_current: byId('pwNow').value, p_next: byId('pwNew').value });
    if (d.error) { byId('pwErr').textContent = d.error; return; }
    logout();
    byId('nick').value = nick;
    byId('err').textContent = '비밀번호를 바꿨어요. 모든 기기에서 나갔어요. 새 비밀번호로 들어와 주세요.';
  } catch (x) { byId('pwErr').textContent = x.message; } finally { btn.disabled = false; }
};
/* 탈퇴하고 내 기록 지우기(2026-11-17): 비밀번호 다시 확인 → 「되돌릴 수 없어요」 확인 한 번 → 서버 life_delete_me.
   다른 앱(업무 기록·라이프 RPG)과 같이 쓰는 계정은 계정은 남기고 건강 기록만 지운다 */
byId('amDel').onclick = () => { byId('delForm').reset(); byId('delErr').textContent = ''; amView('del'); };
byId('delBack').onclick = () => amView('set');
byId('delForm').onsubmit = async e => {
  e.preventDefault();
  byId('delErr').textContent = '';
  if (!await ask('정말 지울까요?\n지우면 되돌릴 수 없어요.', '지우기')) return;
  const btn = byId('delGo'); btn.disabled = true;
  try {
    const d = await rpc('life_delete_me', { p_token: token, p_pw: byId('delPw').value });
    if (d.error) { byId('delErr').textContent = d.error; return; }
    if (d.kept) {
      byId('amBg').hidden = true; tab = 'today'; historyItems = []; historyDone = false;
      alert('건강 기록을 모두 지웠어요. 이 계정은 다른 앱과 같이 써서 계정은 남겨 두었어요.');
      await refresh();
      return;
    }
    unlockPhone(); store.del('life_bed'); store.del('life_awake'); store.del('life_alarm'); store.del('life_unlocked');
    logout();
    byId('err').textContent = '탈퇴했어요. 내 기록을 모두 지웠어요.';
  } catch (x) { byId('delErr').textContent = x.message; } finally { btn.disabled = false; }
};
if (token) refresh().catch(x => { if (token) $app.innerHTML = `<p class="err">${esc(x.message)}</p>`; });
else renderAuth('login');
</script>
</body>
</html>
