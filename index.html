<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f7d5b">
<title>🌱 건강 기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://trlnatdkebjvgiqneulv.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #2f7d5b; --main-soft: #e4f2ea; --sun: #f5a524; --ink: #1d2a24; --sub: #66736c;
    --line: #dfe5e1; --bg: #f7f6f1; --card: #fff; --err: #c8452f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 16px; line-height: 1.5; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }
  h1 { font-size: 24px; font-weight: 900; margin: 0 0 4px; }
  h2 { font-size: 17px; font-weight: 900; margin: 24px 0 10px; }
  p { margin: 0; }
  .sub { color: var(--sub); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px; min-height: 48px; padding: 0 16px; background: var(--main-soft); color: var(--main); }
  button.main { background: var(--main); color: #fff; width: 100%; font-size: 17px; min-height: 56px; }
  button:disabled { opacity: .5; }
  input, select { font: inherit; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  select { font-size: 20px; font-weight: 700; text-align: center; }
  label.f { display: block; margin-top: 12px; font-size: 14px; font-weight: 700; }
  label.f input { margin-top: 4px; }
  .err { color: var(--err); font-size: 14px; margin-top: 10px; min-height: 20px; }
  .switch { color: var(--main); background: none; width: 100%; font-size: 14px; margin-top: 4px; }
  .consent { background: var(--main-soft); border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
  .consent ul { margin: 6px 0 0; padding-left: 18px; }
  .ask { text-align: center; padding-top: 32px; }
  .ask .big { font-size: 56px; line-height: 1.1; }
  .ask h1 { margin-top: 12px; }
  .ask .card { margin-top: 20px; text-align: left; }
  .faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .faces button { background: #f2f3ef; font-size: 26px; padding: 0; min-height: 56px; }
  .faces button.on { background: var(--main-soft); outline: 2px solid var(--main); }
  .week { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .week b { font-size: 22px; font-weight: 900; white-space: nowrap; }
  .bar { flex: 1; height: 12px; border-radius: 6px; background: #e8e9e3; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--main); transition: width .3s; }
  .checks { display: grid; gap: 8px; margin-top: 16px; }
  .check { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-height: 68px; }
  .check .ico { font-size: 28px; }
  .check .txt { flex: 1; min-width: 0; }
  .check .txt strong { display: block; font-weight: 900; }
  .check.done { background: var(--main-soft); border-color: var(--main); }
  .check button { min-height: 44px; padding: 0 12px; font-size: 14px; white-space: nowrap; }
  .check .btns { display: flex; gap: 6px; }
  .check .pick { background: var(--main); color: #fff; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row.mine .nm { font-weight: 900; color: var(--main); }
  .dots { font-size: 18px; letter-spacing: 2px; white-space: nowrap; }
  .post { padding: 0; overflow: hidden; margin-bottom: 12px; }
  .post .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
  .post .head .nm { flex: 1; font-weight: 900; overflow-wrap: anywhere; }
  .post img { display: block; width: 100%; }
  .post .del { background: none; color: var(--sub); min-height: 36px; padding: 0 4px; font-size: 13px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { color: var(--sub); font-size: 12px; text-align: center; padding: 4px 2px; }
  .tbl td { text-align: center; padding: 8px 2px; border-top: 1px solid var(--line); }
  [hidden] { display: none !important; }
  /* ☰ 계정 창: 업무 기록·영성 기록과 같은 모양(2026-11-02 룡: 기본 화면 통일) */
  #menuBtn { position: absolute; top: 8px; right: 10px; z-index: 5; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; min-height: 36px; padding: 0 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .am-bg { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .am { max-height: 100%; overflow-y: auto; width: 100%; max-width: 360px; background: var(--card); color: var(--ink); border-radius: 18px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .am-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 12px; }
  .am-head strong { font-size: 17px; }
  .am-x { background: none; color: var(--sub); font-size: 18px; width: 36px; min-height: 36px; padding: 0; }
  .am-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; margin-top: 8px; padding: 14px 16px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
  .am-item small { color: var(--sub); font-size: 12px; font-weight: 400; }
  .am-item .am-go { color: var(--sub); font-size: 18px; font-weight: 400; }
  .am-item.danger { color: var(--err); }
  .am-back { background: none; color: var(--sub); font-size: 14px; min-height: 32px; padding: 4px 2px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabs div { max-width: 480px; margin: 0 auto; display: flex; }
  .tabs button { flex: 1; background: none; color: var(--sub); border-radius: 0; min-height: 60px; padding: 0; font-size: 13px; }
  .tabs button.on { color: var(--main); font-weight: 900; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  .loading { text-align: center; color: var(--sub); padding: 48px 0; }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div id="tabs"></div>
<button id="menuBtn" aria-label="내 계정" hidden><span id="myName"></span> ☰</button>
<div class="am-bg" id="amBg" role="dialog" aria-modal="true" aria-labelledby="amName" hidden>
  <div class="am">
    <div class="am-head"><strong id="amName"></strong><button type="button" class="am-x" id="amClose" aria-label="닫기">✕</button></div>
    <div id="amMain">
      <button type="button" class="am-item" id="amSet"><span>⚙️ 설정</span><span class="am-go">›</span></button>
      <button type="button" class="am-item danger" id="amOut"><span>로그아웃</span><small>모든 기기에서 나가져요</small></button>
    </div>
    <div id="amSetView" hidden>
      <button type="button" class="am-back" id="amBack">‹ 처음으로</button>
      <button type="button" class="am-item" id="amPw"><span>비밀번호 바꾸기</span><span class="am-go">›</span></button>
    </div>
    <form id="pwForm" hidden>
      <button type="button" class="am-back" id="pwBack">‹ 설정으로</button>
      <p class="sub" id="pwMust" hidden>처음 비밀번호예요. 나만 아는 새 비밀번호로 바꿔 주세요. 바꾼 비밀번호는 다른 사람이 알 수 없어요.</p>
      <div class="consent" id="pwConsent" hidden><b>시작하기 전에</b><ul>
        <li>식단과 운동은 우리 조 사람들과 함께 봅니다.</li>
        <li>수면과 컨디션은 소그룹 리더와 나만 봅니다.</li>
        <li>기록은 돌봄과 생활개선에만 씁니다. 나중에 분석을 시작할 때는 먼저 알려 드립니다.</li>
        <li>원하면 언제든 기록을 모두 지워 드립니다.</li>
      </ul></div>
      <label class="f" style="margin-top:6px">지금 비밀번호<input id="pwNow" type="password" autocomplete="current-password" required></label>
      <label class="f">새 비밀번호 (6자 이상, 영어+숫자)<input id="pwNew" type="password" autocomplete="new-password" required minlength="6"></label>
      <label class="f">새 비밀번호 한 번 더<input id="pwNew2" type="password" autocomplete="new-password" required minlength="6"></label>
      <div class="err" id="pwErr"></div>
      <button class="main" id="pwGo">바꾸기</button>
    </form>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
const SB_URL = 'https://trlnatdkebjvgiqneulv.supabase.co';
const SB_KEY = 'sb_publishable_BqE1VCDg50oi9zCflCjMuw_wYF55CTj';
const FACES = ['😫','😕','😐','🙂','😄'];
const CHEERS = {
  exercise: ['운동 완료! 몸이 고마워해요 💪','오늘도 해냈어요 🔥','한 걸음 더 건강해졌어요 🌱'],
  diet: ['식단 체크! 잘 챙기셨어요 🥗','먹는 것도 실력이에요 🍚','오늘 한 끼도 소중하게 👍'],
  bed: ['오늘 하루 수고하셨어요 🌙','잘 자는 것도 운동이에요 😴','내일 다시 새로 시작해요 ✨']
};

const byId = id => document.getElementById(id);
const $app = document.getElementById('app');
const $tabs = document.getElementById('tabs');
const $file = document.getElementById('file');
let state = null, tab = 'today', pendingKind = null, faceSel = null, historyItems = [], historyDone = false;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let token = store.get('life_token');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hm(t) { return t ? t.slice(0, 5) : '-'; }
/* DB의 life_today()와 같은 계산: 서울 시각 새벽 4시가 하루 경계 */
function seoulToday() { return new Date(Date.now() + 5 * 3600000).toISOString().slice(0, 10); }

async function rpc(fn, args) {
  let r;
  try {
    r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
  } catch (e) { throw new Error('인터넷 연결을 확인해 주세요.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) {
    if (d && d.message === 'auth') { logout(); throw new Error('다시 로그인해 주세요.'); }
    /* 새벽 4시를 넘겨 화면이 어제에 머문 경우: 새로 불러와 오늘 순서로 보낸다 */
    if (d && ['need_wake', 'need_bed', 'not_needed'].includes(d.message)) {
      tab = 'today'; await refresh(); throw new Error('날이 바뀌었어요. 오늘 기록을 시작해 주세요.');
    }
    throw new Error('저장하지 못했어요. 다시 해 주세요.');
  }
  return d;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function logout() { token = null; store.del('life_token'); state = null; tab = 'today'; byId('menuBtn').hidden = true; byId('amBg').hidden = true; unforcePw(); renderAuth('login'); }

/* 시간 고르기: 30분 단위 */
function timeOptions(startHour, selected) {
  let h = '';
  for (let i = 0; i < 48; i++) {
    const min = (startHour * 60 + i * 30) % 1440;
    const v = String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
    h += `<option value="${v}"${v === selected ? ' selected' : ''}>${v}</option>`;
  }
  return h;
}
function nowRounded() {
  const d = new Date(); const m = Math.round((d.getHours() * 60 + d.getMinutes()) / 30) * 30 % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

/* 가입·로그인 */
function renderAuth(mode) {
  $tabs.innerHTML = '';
  const signup = mode === 'signup';
  $app.innerHTML = `
    <div class="ask"><div class="big">🌱</div><h1>건강 기록</h1>
    <p class="sub">기상부터 취침까지, 하루 30초</p></div>
    <div class="card" style="margin-top:20px">
      <form id="f">
        ${signup ? '<label class="f">초대 코드 (리더에게 받아요)<input id="code" autocomplete="off" autocapitalize="characters" required></label>' : ''}
        <label class="f">${signup ? '아이디 (닉네임, 본명 말고 편한 이름으로)' : '아이디'}<input id="nick" maxlength="12" autocomplete="username" required></label>
        <label class="f">${signup ? '비밀번호 (6자 이상, 영어+숫자)' : '비밀번호'}<input id="pw" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" required></label>
        ${signup ? `<div class="consent"><b>시작하기 전에</b><ul>
          <li>식단과 운동은 우리 조 사람들과 함께 봅니다.</li>
          <li>수면과 컨디션은 소그룹 리더와 나만 봅니다.</li>
          <li>기록은 돌봄과 생활개선에만 씁니다. 나중에 분석을 시작할 때는 먼저 알려 드립니다.</li>
          <li>원하면 언제든 기록을 모두 지워 드립니다.</li>
        </ul></div>` : ''}
        <div class="err" id="err"></div>
        <button class="main" id="go">${signup ? '동의하고 시작' : '들어가기'}</button>
      </form>
      <button class="switch" id="sw">${signup ? '이미 가입했어요' : '초대 코드로 가입하기'}</button>
    </div>`;
  document.getElementById('sw').onclick = () => renderAuth(signup ? 'login' : 'signup');
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const nick = document.getElementById('nick').value, pw = document.getElementById('pw').value;
      const d = signup
        ? await rpc('life_signup', { p_code: document.getElementById('code').value, p_nick: nick, p_pw: pw, p_consent: true })
        : await rpc('life_login', { p_nick: nick, p_pw: pw });
      if (d.error) { err.textContent = d.error; go.disabled = false; return; }
      token = d.token; store.set('life_token', token);
      await refresh();
    } catch (x) { err.textContent = x.message; go.disabled = false; }
  };
}

/* 어제 취침 → 오늘 기상 → 오늘 화면 */
function renderBedYesterday() {
  $tabs.innerHTML = '';
  $app.innerHTML = `<div class="ask"><div class="big">🌙</div><h1>어제 몇 시에 주무셨어요?</h1>
    <p class="sub">기억이 안 나면 대략 골라 주세요</p>
    <div class="card"><select id="t">${timeOptions(18, store.get('life_bed') || '23:00')}</select>
    <div class="err" id="err"></div><button class="main" id="go">다음</button></div></div>`;
  document.getElementById('go').onclick = () => {
    const v = document.getElementById('t').value;
    store.set('life_bed', v);
    act('life_bed', { p_token: token, p_which: 'yesterday', p_time: v });
  };
}
function renderWake() {
  $tabs.innerHTML = '';
  faceSel = null;
  $app.innerHTML = `<div class="ask"><div class="big">☀️</div><h1>좋은 아침이에요!</h1>
    <p class="sub">오늘은 모두 0개에서 다시 시작해요</p>
    <div class="card">
      <label class="f" style="margin-top:0">몇 시에 일어나셨어요?</label>
      <select id="t" style="margin-top:6px">${timeOptions(4, nowRounded())}</select>
      <label class="f">오늘 컨디션은요?</label>
      <div class="faces">${FACES.map((f, i) => `<button type="button" data-v="${i + 1}" aria-label="컨디션 ${i + 1}">${f}</button>`).join('')}</div>
      <div class="err" id="err"></div>
      <button class="main" id="go">오늘 시작</button>
    </div></div>`;
  document.querySelectorAll('.faces button').forEach(b => b.onclick = () => {
    faceSel = +b.dataset.v;
    document.querySelectorAll('.faces button').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('go').onclick = () => {
    if (!faceSel) { document.getElementById('err').textContent = '컨디션을 골라 주세요.'; return; }
    act('life_wake', { p_token: token, p_time: document.getElementById('t').value, p_condition: faceSel });
  };
}

async function act(fn, args, cheer) {
  const go = document.getElementById('go');
  if (go) go.disabled = true;
  try {
    state = await rpc(fn, args);
    historyItems = []; historyDone = false;
    if (cheer) toast(cheer);
    render();
  } catch (x) {
    const err = document.getElementById('err');
    if (err) err.textContent = x.message; else toast(x.message);
    if (go) go.disabled = false;
  }
}

/* 오늘 */
function checkCard(kind, ico, name, on) {
  return `<div class="check${on ? ' done' : ''}">
    <div class="ico">${ico}</div>
    <div class="txt"><strong>${name} ${on ? '✅' : ''}</strong></div>
    <div class="btns">
      ${on ? '' : `<button data-check="${kind}">체크</button>`}
      <button class="pick" data-photo="${kind}">📷 사진</button>
    </div></div>`;
}
function renderToday() {
  const s = state, d = s.day, goal = s.me.goal, wk = s.week;
  const pct = Math.min(100, Math.round(wk / goal * 100));
  const board = (s.board || []).map(b => `
    <div class="row${b.mine ? ' mine' : ''}">
      <div class="nm">${esc(b.nickname)}</div>
      <div class="dots">${'✅'.repeat(b.count)}${'⬜'.repeat(3 - b.count)}</div>
    </div>`).join('');
  $app.innerHTML = `
    <h1>${esc(s.me.nickname)}님의 오늘</h1>
    <div class="week"><b>${wk}/${goal}</b><div class="bar"><i style="width:${pct}%"></i></div></div>
    <p class="sub">${wk >= goal ? '이번 주 통과! 🎉' : `이번 주 ${goal - wk}개 남았어요`}</p>
    <div class="checks">
      ${checkCard('exercise', '🏃', '운동', d.exercise)}
      ${checkCard('diet', '🥗', '식단', d.diet)}
      <div class="check${d.bed ? ' done' : ''}">
        <div class="ico">🌙</div>
        <div class="txt"><strong>수면 ${d.bed ? '✅' : ''}</strong><span class="sub">기상 ${hm(d.wake)}${d.bed ? ' · 취침 ' + hm(d.bed) : ''}</span></div>
        <div class="btns"><button class="${d.bed ? '' : 'pick'}" id="bedBtn">${d.bed ? '고치기' : '잘게요'}</button></div>
      </div>
    </div>
    <div id="bedBox"></div>
    <h2>오늘 우리 조</h2>
    <div class="card" style="padding:4px 16px">${board}</div>`;
  $app.querySelectorAll('[data-check]').forEach(b => b.onclick = () => {
    b.disabled = true;
    const k = b.dataset.check;
    act('life_post', { p_token: token, p_kind: k, p_photo: null }, pick(CHEERS[k]));
  });
  $app.querySelectorAll('[data-photo]').forEach(b => b.onclick = () => { pendingKind = b.dataset.photo; $file.click(); });
  document.getElementById('bedBtn').onclick = () => {
    document.getElementById('bedBox').innerHTML = `<div class="card" style="margin-top:8px">
      <label class="f" style="margin-top:0">몇 시에 주무세요?</label>
      <select id="t" style="margin-top:6px">${timeOptions(18, d.bed ? hm(d.bed) : nowRounded())}</select>
      <div class="err" id="err"></div><button class="main" id="go">오늘 마감</button></div>`;
    document.getElementById('go').onclick = () => {
      const v = document.getElementById('t').value;
      store.set('life_bed', v);
      act('life_bed', { p_token: token, p_which: 'today', p_time: v }, pick(CHEERS.bed));
    };
    document.getElementById('bedBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
}

/* 사진: 줄이면서 위치 정보가 함께 사라진다 */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let size = 800, q = .7, data = '';
      for (let i = 0; i < 5; i++) {
        const k = Math.min(1, size / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', q);
        if (data.length < 390000) return resolve(data);
        size *= .8; q -= .1;
      }
      reject(new Error('사진이 너무 커요.'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요.')); };
    img.src = url;
  });
}
$file.onchange = async () => {
  const f = $file.files[0], kind = pendingKind;
  $file.value = '';
  if (!f || !kind) return;
  toast('사진 올리는 중…');
  try {
    const data = await shrink(f);
    state = await rpc('life_post', { p_token: token, p_kind: kind, p_photo: data });
    historyItems = []; historyDone = false;
    toast(pick(CHEERS[kind]));
    render();
  } catch (x) { toast(x.message); }
};

/* 히스토리 */
async function loadHistory() {
  const d = await rpc('life_history', { p_token: token, p_offset: historyItems.length });
  historyItems = historyItems.concat(d);
  if (d.length < 10) historyDone = true;
}
function historyHtml() {
  const label = { exercise: '🏃 운동', diet: '🥗 식단' };
  const items = historyItems.map(p => `
    <div class="card post">
      <div class="head"><div class="nm">${esc(p.nickname)}</div><span class="sub">${label[p.kind]} · ${p.day.slice(5).replace('-', '/')}</span>
      ${p.mine ? `<button class="del" data-del="${p.id}">지우기</button>` : ''}</div>
      ${p.photo ? `<img src="${esc(p.photo)}" alt="${label[p.kind]} 사진" loading="lazy">` : ''}
    </div>`).join('');
  return `<h1>우리 조 히스토리</h1><p class="sub" style="margin-bottom:12px">오늘 누가 뭘 먹고 뭘 했을까요?</p>
    ${items || '<p class="sub">아직 올라온 것이 없어요. 첫 번째로 올려 보세요!</p>'}
    ${historyDone ? '' : '<button id="more" style="width:100%">더 보기</button>'}`;
}
async function renderHistory() {
  $app.innerHTML = '<div class="loading">불러오는 중…</div>';
  try {
    if (!historyItems.length) await loadHistory();
    if (tab !== 'history') return;
    $app.innerHTML = historyHtml();
    const more = document.getElementById('more');
    if (more) more.onclick = async () => { more.disabled = true; await loadHistory(); renderHistory(); };
    $app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('이 기록을 지울까요? 사진 없는 하루는 체크도 함께 빠질 수 있어요.')) return;
      state = await rpc('life_delete_post', { p_token: token, p_id: +b.dataset.del });
      historyItems = []; historyDone = false;
      renderHistory();
    });
  } catch (x) { if (token) $app.innerHTML = `<p class="err">${esc(x.message)}</p>`; }
}

/* 내 기록·리더 */
function recordTable(rows) {
  return `<table class="tbl"><tr><th>날짜</th><th>기상</th><th>취침</th><th>컨디션</th><th>운동</th><th>식단</th></tr>
    ${rows.map(r => `<tr><td>${r.day.slice(5).replace('-', '/')}</td><td>${hm(r.wake)}</td><td>${hm(r.bed)}</td>
      <td>${r.condition ? FACES[r.condition - 1] : '-'}</td><td>${r.exercise ? '✅' : '-'}</td><td>${r.diet ? '✅' : '-'}</td></tr>`).join('')}</table>`;
}
async function renderMine() {
  $app.innerHTML = '<div class="loading">불러오는 중…</div>';
  try {
    const rows = await rpc('life_mine', { p_token: token });
    if (tab !== 'mine') return;
    $app.innerHTML = `<h1>내 기록</h1><p class="sub" style="margin-bottom:12px">최근 2주예요. 수면과 컨디션은 리더와 나만 봐요.</p>
      <div class="card">${recordTable(rows)}</div>`;
  } catch (x) { if (token) $app.innerHTML = `<p class="err">${esc(x.message)}</p>`; }
}
async function renderLeader() {
  $app.innerHTML = '<div class="loading">불러오는 중…</div>';
  try {
    const list = await rpc('life_leader', { p_token: token });
    if (tab !== 'leader') return;
    $app.innerHTML = `<h1>조원 살피기</h1><p class="sub">심방 때 참고해 주세요. 여기 내용은 다른 곳에 옮기지 않아요.</p>
      ${list.map(m => `<h2>${esc(m.nickname)}</h2><div class="card">${recordTable(m.records)}</div>`).join('')}`;
  } catch (x) { if (token) $app.innerHTML = `<p class="err">${esc(x.message)}</p>`; }
}

function renderTabs() {
  const items = [['today', '오늘'], ['history', '히스토리'], ['mine', '내 기록']];
  if (state.me.is_leader) items.push(['leader', '조원']);
  $tabs.innerHTML = `<div class="tabs"><div>${items.map(([k, n]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>`;
  $tabs.querySelectorAll('button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab; window.scrollTo(0, 0);
    if (tab === 'today') refresh().catch(x => toast(x.message)); else render();
  });
}
function render() {
  byId('myName').textContent = state.me.nickname; byId('menuBtn').hidden = false;
  if (state.me.must_change_pw) forcePw();
  if (state.need === 'bed_yesterday') return renderBedYesterday();
  if (state.need === 'wake') return renderWake();
  renderTabs();
  if (tab === 'history') return renderHistory();
  if (tab === 'mine') return renderMine();
  if (tab === 'leader') return renderLeader();
  renderToday();
}
async function refresh() {
  state = await rpc('life_state', { p_token: token });
  historyItems = []; historyDone = false;
  render();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !token || !state) return;
  if (state.today !== seoulToday()) { tab = 'today'; refresh().catch(() => {}); return; }
  if (tab === 'today' && !document.getElementById('go')) refresh().catch(() => {});
});

/* ☰ 계정 창. 로그아웃·비밀번호 바꾸기는 다른 기록들처럼 모든 기기에서 나간다 */
/* 처음 비밀번호면 바꾸기 전에는 닫히지 않는다(업무·영성 기록과 같음) */
let pwForced = false;
function forcePw() {
  if (pwForced) return;
  pwForced = true;
  amView('pw'); byId('pwForm').reset(); byId('pwErr').textContent = '';
  byId('amName').textContent = state.me.nickname + '님';
  byId('amClose').hidden = byId('pwBack').hidden = true; byId('pwMust').hidden = false;
  byId('pwConsent').hidden = !state.me.need_consent;
  byId('pwGo').textContent = state.me.need_consent ? '동의하고 바꾸기' : '바꾸기';
  byId('amBg').hidden = false;
}
function unforcePw() {
  pwForced = false;
  byId('amClose').hidden = byId('pwBack').hidden = false; byId('pwMust').hidden = byId('pwConsent').hidden = true;
  byId('pwGo').textContent = '바꾸기';
}
function amView(v) { byId('amMain').hidden = v !== 'main'; byId('amSetView').hidden = v !== 'set'; byId('pwForm').hidden = v !== 'pw'; }
byId('menuBtn').onclick = () => { amView('main'); byId('amName').textContent = state.me.nickname + '님'; byId('amBg').hidden = false; };
byId('amClose').onclick = () => { byId('amBg').hidden = true; };
byId('amBg').onclick = e => { if (e.target === byId('amBg') && !pwForced) byId('amBg').hidden = true; };
byId('amSet').onclick = () => amView('set');
byId('amBack').onclick = () => amView('main');
byId('pwBack').onclick = () => amView('set');
byId('amPw').onclick = () => { byId('pwForm').reset(); byId('pwErr').textContent = ''; amView('pw'); };
byId('amOut').onclick = async () => { await rpc('life_logout_all', { p_token: token }).catch(() => {}); logout(); };
byId('pwForm').onsubmit = async e => {
  e.preventDefault();
  byId('pwErr').textContent = '';
  if (byId('pwNew').value !== byId('pwNew2').value) { byId('pwErr').textContent = '새 비밀번호 두 칸이 서로 달라요.'; return; }
  const btn = e.submitter; btn.disabled = true;
  try {
    const nick = state.me.nickname;
    const d = await rpc('life_change_password', { p_token: token, p_current: byId('pwNow').value, p_next: byId('pwNew').value });
    if (d.error) { byId('pwErr').textContent = d.error; return; }
    logout();
    byId('nick').value = nick;
    byId('err').textContent = '비밀번호를 바꿨어요. 모든 기기에서 나갔어요. 새 비밀번호로 들어와 주세요.';
  } catch (x) { byId('pwErr').textContent = x.message; } finally { btn.disabled = false; }
};
if (token) refresh().catch(x => { if (token) $app.innerHTML = `<p class="err">${esc(x.message)}</p>`; });
else renderAuth('login');
</script>
