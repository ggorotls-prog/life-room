<style>
  /* 기록 앱 공통 바탕(브랜드 가이드 「기록 앱 화면」, 2026-11-11): 바탕·카드·글자·선·글꼴은 네 기록 앱이 같고, 포인트 색(--main)만 앱마다 다르다. */
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f1f1d; --sub: #6b6a64; --line: #e4e2db; --fill: #eceae4;
    --main: #2f7d5b; --main-ink: #ffffff; --main-soft: #e4f2ea; --sun: #f5a524; --err: #d62d1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #22221f; --ink: #ecebe6; --sub: #a3a29b; --line: #34332f; --fill: #2e2d29;
      --main: #7cc7a2; --main-ink: #10201b; --main-soft: #1f2e27; --sun: #f0b350; --err: #ff6454; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; font-weight: 500; font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }
  h1 { font-size: 24px; font-weight: 900; margin: 0 0 4px; }
  h2 { font-size: 17px; font-weight: 900; margin: 24px 0 10px; }
  p { margin: 0; }
  .sub { color: var(--sub); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px; min-height: 48px; padding: 0 16px; background: var(--main-soft); color: var(--main); }
  button.main { background: var(--main); color: var(--main-ink); width: 100%; font-size: 17px; min-height: 56px; }
  button:disabled { opacity: .5; }
  input, select { font: inherit; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
  select { font-size: 20px; font-weight: 700; text-align: center; }
  label.f { display: block; margin-top: 12px; font-size: 14px; font-weight: 700; }
  label.f input { margin-top: 4px; }
  .err { color: var(--err); font-size: 14px; margin-top: 10px; min-height: 20px; }
  .switch { color: var(--main); background: none; width: 100%; font-size: 14px; margin-top: 4px; }
  .consent { background: var(--main-soft); border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
  .consent ul { margin: 6px 0 0; padding-left: 18px; }
  .ask { text-align: center; padding-top: 32px; }
  .ask .big { font-size: 56px; line-height: 1.1; }
  .ask h1 { margin-top: 12px; }
  .ask .card { margin-top: 20px; text-align: left; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .slots button { min-height: 48px; padding: 0 4px; font-size: 14px; }
  .slots button.on { background: var(--main); color: var(--main-ink); }
  .list { margin-top: 8px; font-size: 14px; }
  .list div { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .list div:first-child { border-top: 0; }
  .list .t { color: var(--sub); white-space: nowrap; }
  .exbox { display: flex; gap: 6px; margin-top: 10px; }
  .exbox input { min-height: 48px; }
  .exbox button { white-space: nowrap; }
  .why { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .why button { min-height: 48px; font-size: 14px; }
  .why-td { font-size: 11px; color: var(--sub); white-space: nowrap; }
  .faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .faces button { background: var(--fill); font-size: 26px; padding: 0; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .faces button small { font-size: 12px; font-weight: 700; }
  .faces button.on { background: var(--main-soft); outline: 2px solid var(--main); }
  .week { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .week b { font-size: 22px; font-weight: 900; white-space: nowrap; }
  .bar { flex: 1; height: 12px; border-radius: 6px; background: var(--fill); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--main); transition: width .3s; }
  .checks { display: grid; gap: 8px; margin-top: 16px; }
  .check { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 68px; }
  .check .ico { font-size: 28px; }
  .check .txt { flex: 1; min-width: 0; }
  .check .txt strong { display: block; font-weight: 900; }
  .check.done { background: var(--main-soft); border-color: var(--main); }
  .check button { min-height: 44px; padding: 0 12px; font-size: 14px; white-space: nowrap; }
  .check .btns { display: flex; gap: 6px; }
  .check .pick { background: var(--main); color: var(--main-ink); }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row.mine .nm { font-weight: 900; color: var(--main); }
  .dots { font-size: 18px; letter-spacing: 2px; white-space: nowrap; }
  .post { padding: 0; overflow: hidden; margin-bottom: 12px; }
  .post .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
  .post .head .nm { flex: 1; font-weight: 900; overflow-wrap: anywhere; }
  .post img { display: block; width: 100%; }
  .post .del { background: none; color: var(--sub); min-height: 36px; padding: 0 4px; font-size: 13px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { color: var(--sub); font-size: 12px; text-align: center; padding: 4px 2px; }
  .tbl td { text-align: center; padding: 8px 2px; border-top: 1px solid var(--line); }
  [hidden] { display: none !important; }
  /* ☰ 계정 창: 업무 기록·영성 기록과 같은 모양(2026-11-02 룡: 기본 화면 통일) */
  #menuBtn { position: absolute; top: 8px; right: 10px; z-index: 5; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; min-height: 36px; padding: 0 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .am-bg { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .am { max-height: 100%; overflow-y: auto; width: 100%; max-width: 360px; background: var(--card); color: var(--ink); border-radius: 18px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .am-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 12px; }
  .am-head strong { font-size: 17px; }
  .am-x { background: none; color: var(--sub); font-size: 18px; width: 36px; min-height: 36px; padding: 0; }
  .am-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; margin-top: 8px; padding: 14px 16px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
  .am-item small { color: var(--sub); font-size: 12px; font-weight: 400; }
  .am-item .am-go { color: var(--sub); font-size: 18px; font-weight: 400; }
  .am-item.danger { color: var(--err); }
  .am-back { background: none; color: var(--sub); font-size: 14px; min-height: 32px; padding: 4px 2px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabs div { max-width: 480px; margin: 0 auto; display: flex; }
  .tabs button { flex: 1; background: none; color: var(--sub); border-radius: 0; min-height: 60px; padding: 0; font-size: 13px; }
  .tabs button.on { color: var(--main); font-weight: 900; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  .loading { text-align: center; color: var(--sub); padding: 48px 0; }
</style>

<script>
const SB_URL = 'https://trlnatdkebjvgiqneulv.supabase.co';
const SB_KEY = 'sb_publishable_BqE1VCDg50oi9zCflCjMuw_wYF55CTj';
const FACES = ['😫','😐','😄'], FACE_NAMES = ['나쁨', '보통', '좋음'];
const CHEERS = {
  exercise: ['운동 완료! 몸이 고마워해요 💪','오늘도 해냈어요 🔥','한 걸음 더 건강해졌어요 🌱'],
  diet: ['식단 체크! 잘 챙기셨어요 🥗','먹는 것도 실력이에요 🍚','오늘 한 끼도 소중하게 👍'],
  bed: ['오늘 하루 수고하셨어요 🌙','잘 자는 것도 운동이에요 😴','내일 다시 새로 시작해요 ✨']
};

const byId = id => document.getElementById(id);
const $app = document.getElementById('app');
const $tabs = document.getElementById('tabs');
const $file = document.getElementById('file');
let state = null, tab = 'today', pendingKind = null, pendingSlot = null, faceSel = null, historyItems = [], historyDone = false;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let token = store.get('life_token');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hm(t) { return t ? t.slice(0, 5) : '-'; }
/* DB의 life_today()와 같은 계산: 서울 시각 새벽 4시가 하루 경계 */
function seoulToday() { return new Date(Date.now() + 5 * 3600000).toISOString().slice(0, 10); }

async function rpc(fn, args) {
  let r;
  try {
    r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
  } catch (e) { throw new Error('인터넷 연결을 확인해 주세요.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) {
    if (d && d.message === 'auth') { logout(); throw new Error('다시 로그인해 주세요.'); }
    /* 새벽 4시를 넘겨 화면이 어제에 머문 경우: 새로 불러와 오늘 순서로 보낸다 */
    if (d && ['need_wake', 'need_bed', 'not_needed'].includes(d.message)) {
      tab = 'today'; await refresh(); throw new Error('날이 바뀌었어요. 오늘 기록을 시작해 주세요.');
    }
    throw new Error('저장하지 못했어요. 다시 해 주세요.');
  }
  return d;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function logout() { token = null; store.del('life_token'); state = null; tab = 'today'; byId('menuBtn').hidden = true; byId('amBg').hidden = true; unforcePw(); renderAuth('login'); }

/* 시간 고르기: 30분 단위 */
function timeOptions(startHour, selected) {
  let h = '';
  for (let i = 0; i < 48; i++) {
    const min = (startHour * 60 + i * 30) % 1440;
    const v = String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
    h += `<option value="${v}"${v === selected ? ' selected' : ''}>${v}</option>`;
  }
  return h;
}
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

/* 취침 잠금(2026-11-06 룡 결정: 안드로이드 앱의 접근성 서비스). 「잘게요」 → 다른 앱을 열면 이 앱으로 돌아옴, 「일어났어요」 → 풀림.
   「해제하기」를 누르면 사유 한 번 고르고 풀린다(기록에 남음). 브라우저에서는 잠금 없이 기록만. */
const phone = window.LifeRoom || null;
function lockPhone() { store.set('life_lock', '1'); store.del('life_lock_fail'); if (phone) try { phone.lock(); } catch (e) {} }
function unlockPhone() { clearInterval(lockTimer); store.del('life_lock'); if (phone) try { phone.unlock(); } catch (e) {} }
let unlockAsked = false;
window.lifeUnpinned = () => { if (store.get('life_lock') === '1' && !unlockAsked) { unlockAsked = true; if (state) render(); } };
window.lifeLockFailed = () => {
  if (store.get('life_lock') !== '1' || store.get('life_lock_fail') === '1') return;
  store.set('life_lock_fail', '1'); if (state) render();
};
/* 긴급 해제(2026-11-07 룡): 「일어났어요」는 일어날 때 내가 누르는 것, 그 전에 유혹을 못 참거나 사유가 있으면 긴급 해제.
   사유를 직접 적어야 풀리고, 사유는 내 기록·리더 화면 「해제」 칸에 남는다 */
function unlockCard() {
  return `<div class="card" style="margin-top:16px;text-align:left"><strong>🚨 긴급 해제</strong>
    <p class="sub" style="margin:4px 0 8px">왜 지금 풀어야 하나요? 적은 사유는 기록에 남아요.</p>
    <input id="whyNote" maxlength="40" placeholder="예: 내일 일정 연락할 게 있어서" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="main" id="whyGo" type="button">사유 적고 해제</button>
    <button class="switch" id="whyBack" type="button">취소 (계속 잘게요)</button></div>`;
}
function bindUnlock(onDone) {
  const inp = byId('whyNote'), go = byId('whyGo');
  byId('whyBack').onclick = () => { unlockAsked = false; render(); };
  go.onclick = async () => {
    const note = inp.value.trim();
    if (note.length < 2) { byId('err').textContent = '사유를 적어 주세요.'; inp.focus(); return; }
    go.disabled = true;
    /* 기록 먼저, 그다음 풀기. 인터넷이 끊겨 기록을 못 해도 긴급이니 풀어 준다 */
    try { state = await rpc('life_unlock', { p_token: token, p_note: note }); }
    catch (x) { toast('기록은 못 했어요. 잠금은 풀었어요.'); }
    unlockPhone(); unlockAsked = false; onDone();
  };
}
function emergencyBtn() {
  return phone && store.get('life_lock') === '1' ? `<button class="switch" type="button" id="emBtn" style="color:var(--sub)">🚨 긴급 해제</button>` : '';
}
function bindEmergency() { const b = byId('emBtn'); if (b) b.onclick = () => { unlockAsked = true; clearInterval(lockTimer); render(); }; }
function pinGuide() {
  if (!phone || store.get('life_lock_fail') !== '1') return '';
  return `<div class="card" style="margin-top:12px;text-align:left;font-size:14px">📌 아직 잠글 수 없어요. 폰 설정을 한 번만 이 순서로 해 주세요.<br>① 설정 &gt; 접근성 &gt; 설치된 앱 &gt; <b>건강 기록</b> 눌러 보기 → 「제한된 설정」 창이 뜨면 확인<br>② 설정 &gt; 애플리케이션 &gt; 건강 기록 &gt; 오른쪽 위 ⋮ &gt; <b>제한된 설정 허용</b> (①을 해야 ⋮에 나와요)<br>③ 다시 접근성 &gt; 설치된 앱 &gt; <b>건강 기록</b> 켜기<br>이미 켜져 있는데 안 잠기면: 접근성 &gt; 건강 기록을 <b>껐다가 다시 켜기</b><br>그 뒤 「다시 잠그기」.
    <button type="button" id="pinSet" style="width:100%;margin-top:8px">설정 열기</button></div>`;
}
function lockLine() {
  if (!phone || store.get('life_lock') !== '1') return '';
  return `<p class="sub" id="lockLine" style="margin-top:10px">…</p>`;
}
let lockTimer = null;
function keepLocked() {
  clearInterval(lockTimer);
  if (!phone || store.get('life_lock') !== '1' || unlockAsked) return;
  const paint = () => {
    const el = document.getElementById('lockLine'); if (!el) { clearInterval(lockTimer); return; }
    let on = false; try { on = phone.isLocked(); } catch (e) {}
    el.innerHTML = on ? '🔒 폰이 잠겼어요. 일어나면 「일어났어요」'
      : '🔓 아직 안 잠겼어요 <button type="button" id="relock" style="min-height:36px;font-size:13px;margin-left:6px">다시 잠그기</button>';
    const b = document.getElementById('relock'); if (b) b.onclick = () => { store.set('life_lock', '1'); store.del('life_lock_fail'); try { phone.lock(); } catch (e) {} };
  };
  let on = false; try { on = phone.isLocked(); } catch (e) {}
  if (!on && store.get('life_lock_fail') !== '1') try { phone.lock(); } catch (e) {}
  paint(); lockTimer = setInterval(paint, 2000);
}
function bindPinGuide() { const b = document.getElementById('pinSet'); if (b) b.onclick = () => { store.del('life_lock_fail'); try { phone.openPinSettings(); } catch (e) {} }; }
function nowRounded() {
  const d = new Date(); const m = Math.round((d.getHours() * 60 + d.getMinutes()) / 30) * 30 % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

/* 사진: 줄이면서 위치 정보가 함께 사라진다 */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let size = 800, q = .7, data = '';
      for (let i = 0; i < 5; i++) {
        const k = Math.min(1, size / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', q);
        if (data.length < 390000) return resolve(data);
        size *= .8; q -= .1;
      }
      reject(new Error('사진이 너무 커요.'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요.')); };
    img.src = url;
  });
}

  } catch (x) { if (token) $app.innerHTML = `<p class="err">${esc(x.message)}</p>`; }
}

function renderTabs() {
  const items = [['today', '오늘'], ['history', '히스토리'], ['mine', '내 기록']];
  if (state.me.is_leader) items.push(['leader', '조원']);
  $tabs.innerHTML = `<div class="tabs"><div>${items.map(([k, n]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>`;
  $tabs.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.tab !== tab) tabTrail.push(tab);
    tab = b.dataset.tab; window.scrollTo(0, 0);
    if (tab === 'today') refresh().catch(x => toast(x.message)); else render();
  });
}
function render() {
  byId('myName').textContent = state.me.nickname; byId('menuBtn').hidden = false;
  if (state.me.must_change_pw) forcePw();
  if (state.need === 'bed_yesterday') return renderBedYesterday();
  if (state.need === 'wake') return renderWake();
  if (state.day && state.day.bed && store.get('life_awake') !== state.today) return renderSleeping();
  /* 자는 중이 아닌데 잠금이 남아 있으면 푼다(취침 기록을 지웠거나 날이 바뀐 경우) */
  if (store.get('life_lock') === '1') { unlockAsked = false; unlockPhone(); }
  renderTabs();
  if (tab === 'history') return renderHistory();
  if (tab === 'mine') return renderMine();
  if (tab === 'leader') return renderLeader();
  renderToday();
}
async function refresh() {
  state = await rpc('life_state', { p_token: token });
  historyItems = []; historyDone = false;
  render();
}
/* 새 버전 알아차리기(2026-11-06 룡: 앱이 옛 화면을 계속 보여 줌). 앱으로 돌아올 때마다 서버의 파일 표식을 보고 바뀌었으면 새로 연다 */
let siteTag = null;
async function siteVersion() {
  try { const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }); return r.headers.get('etag') || r.headers.get('last-modified'); }
  catch (e) { return null; }
}
siteVersion().then(t => { siteTag = t; });
async function checkNewSite() {
  const t = await siteVersion();
  if (t && siteTag && t !== siteTag && !document.getElementById('go')) { location.reload(); return true; }
  if (t && !siteTag) siteTag = t;
  return false;
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !token || !state) return;
  if (await checkNewSite()) return;
  if (state.today !== seoulToday()) { tab = 'today'; refresh().catch(() => {}); return; }
  if (tab === 'today' && !document.getElementById('go')) refresh().catch(() => {});
});

/* ☰ 계정 창. 로그아웃은 이 앱의 모든 기기에서, 비밀번호를 바꾸면 모든 기록에서 나간다 */
/* 처음 비밀번호면 바꾸기 전에는 닫히지 않는다(업무·영성 기록과 같음) */
let pwForced = false;
function forcePw() {
  if (pwForced) return;
  pwForced = true;
  amView('pw'); byId('pwForm').reset(); byId('pwErr').textContent = '';
  byId('amName').textContent = state.me.nickname + '님';
  byId('amClose').hidden = byId('pwBack').hidden = true; byId('pwMust').hidden = false;
  byId('pwConsent').hidden = !state.me.need_consent;
  byId('pwGo').textContent = state.me.need_consent ? '동의하고 바꾸기' : '바꾸기';
  byId('amBg').hidden = false;
}
function unforcePw() {
  pwForced = false;
  byId('amClose').hidden = byId('pwBack').hidden = false; byId('pwMust').hidden = byId('pwConsent').hidden = true;
  byId('pwGo').textContent = '바꾸기';
}
function amView(v) { byId('amMain').hidden = v !== 'main'; byId('amSetView').hidden = v !== 'set'; byId('pwForm').hidden = v !== 'pw'; }
byId('menuBtn').onclick = () => { amView('main'); byId('amName').textContent = state.me.nickname + '님'; byId('amBg').hidden = false; };
byId('amClose').onclick = () => { byId('amBg').hidden = true; };
byId('amBg').onclick = e => { if (e.target === byId('amBg') && !pwForced) byId('amBg').hidden = true; };
// 앱의 뒤로 가기(2026-11-11 룡: 꺼지지 말고 전 단계로): 열린 계정 창 → 직전 탭 → 「오늘」 → 맨 위. 더 갈 데가 없을 때만 앱이 닫힌다.
const tabTrail = [];
window.appBack = () => {
  if (!byId('amBg').hidden) {
    if (pwForced) return true; // 비밀번호를 꼭 바꿔야 할 때는 안 닫힌다
    if (!byId('pwForm').hidden) amView('set'); else if (!byId('amSetView').hidden) amView('main'); else byId('amBg').hidden = true;
    return true;
  }
  if (!state || !token) return false;
  if (tab !== 'today') {
    tab = tabTrail.pop() || 'today'; if (tab === 'today') tabTrail.length = 0;
    window.scrollTo(0, 0);
    if (tab === 'today') refresh().catch(x => toast(x.message)); else render();
    return true;
  }
  if (window.scrollY > 200) { window.scrollTo({ top: 0, behavior: 'smooth' }); return true; }
  return false;
};
byId('amSet').onclick = () => amView('set');
byId('amBack').onclick = () => amView('main');
byId('pwBack').onclick = () => amView('set');
byId('amPw').onclick = () => { byId('pwForm').reset(); byId('pwErr').textContent = ''; amView('pw'); };
byId('amOut').onclick = async () => { await rpc('life_logout_all', { p_token: token }).catch(() => {}); logout(); };
byId('pwForm').onsubmit = async e => {
  e.preventDefault();
  byId('pwErr').textContent = '';
  if (byId('pwNew').value !== byId('pwNew2').value) { byId('pwErr').textContent = '새 비밀번호 두 칸이 서로 달라요.'; return; }
  const btn = e.submitter; btn.disabled = true;
  try {
    const nick = state.me.nickname;
    const d = await rpc('life_change_password', { p_token: token, p_current: byId('pwNow').value, p_next: byId('pwNew').value });
    if (d.error) { byId('pwErr').textContent = d.error; return; }
    logout();
    byId('nick').value = nick;
    byId('err').textContent = '비밀번호를 바꿨어요. 모든 기기에서 나갔어요. 새 비밀번호로 들어와 주세요.';
  } catch (x) { byId('pwErr').textContent = x.message; } finally { btn.disabled = false; }
};
if (token) refresh().catch(x => { if (token) $app.innerHTML = `<p class="err">${esc(x.message)}</p>`; });
else renderAuth('login');
</script>
</body>
</html>
