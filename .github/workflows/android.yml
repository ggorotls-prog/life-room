# 건강 기록(옛 이름 생활개선방) 안드로이드 앱 APK를 GitHub가 만든다(2026-11-01, 개인 기록 앱과 비슷한 방식). 컴퓨터에 설치할 것 없음.
name: android-apk

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

# 연달아 올리면 「사이트에 올리기」끼리 부딪혀 실패 메일이 왔다(2026-11-07). 한 번에 하나씩 차례로 돈다
concurrency: android-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # 서명 열쇠는 하나로 고정한다(2026-11-07). 빌드마다 새 열쇠면 폰에서 지우고 다시 깔아야 해서 접근성 설정이 꺼졌다.
      # 원본은 드라이브 ★개인\_맥락\비밀키\life-room\, 여기엔 GitHub 비밀값으로 들어 있다.
      - name: 서명 열쇠 꺼내기
        env:
          KS_B64: ${{ secrets.LIFE_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.LIFE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "서명 열쇠 비밀값이 없어요"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/life.p12"
          keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/life.p12" -storepass "$KS_PW" -alias lifeapp > /dev/null
          echo "KEYSTORE_FILE=$RUNNER_TEMP/life.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
      - name: APK 만들기
        run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: life-room-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  # 가상 안드로이드 폰에 깔아서 실제로 켜 본다. 켜자마자 꺼지면 실패로 표시한다.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: life-room-apk
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell am start -W -n app.liferoom/.MainActivity
            sleep 20
            adb logcat -d -b crash > crash.txt || true
            echo "===== crash ====="; cat crash.txt
            if grep -q "FATAL EXCEPTION" crash.txt; then exit 1; fi
            adb shell pidof app.liferoom || { echo "앱이 꺼져 있어요"; exit 1; }
            echo "앱이 켜져 있어요"
            adb shell dumpsys alarm | grep -c "app.liferoom" || { echo "알림이 안 걸렸어요"; exit 1; }
            # 취침 잠금 서비스가 폰과 실제로 이어지는지 본다(2026-11-08)
            adb shell settings put secure enabled_accessibility_services app.liferoom/app.liferoom.LockService
            adb shell settings put secure accessibility_enabled 1
            sleep 5
            adb shell dumpsys accessibility > acc.txt || true
            grep -i -E "liferoom|Bound services" acc.txt || true
            grep "Bound services" acc.txt | grep -q "취침 잠금" || { echo "잠금 서비스가 안 이어졌어요"; exit 1; }
            echo "잠금 서비스 이어짐"
            # 앱을 다시 열면 배터리 「제한 없음」 안내가 뜨는지 본다(2026-11-09). 화면 읽기는 접근성 서비스를 끄므로 맨 끝에
            adb logcat -c
            adb shell am force-stop app.liferoom
            adb shell am start -W -n app.liferoom/.MainActivity
            sleep 15
            adb shell uiautomator dump /sdcard/u.xml || true
            adb shell cat /sdcard/u.xml > u.xml || true
            adb logcat -d -s LifeRoom:I | tail -5 || true
            adb shell dumpsys deviceidle whitelist | grep -i liferoom || echo "배터리 예외 목록에 없음"
            grep -q "제한 없음" u.xml || { echo "배터리 안내가 안 떴어요"; grep -o 'text="[^"]*"' u.xml | head -20; exit 1; }
            echo "배터리 안내 뜸"

  # main에서 가상 폰 확인까지 통과하면 APK를 사이트 app/에 올린다. 가족은 이 주소에서 받아 깐다.
  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: life-room-apk
          path: dist
      - name: 사이트에 올리기
        run: |
          mkdir -p app
          cp dist/app-release.apk app/life-room.apk
          # 폰의 앱이 app/version.json을 보고 새 버전이면 스스로 받아서 업데이트한다(업무·영성·재정 기록 앱과 같음, 2026-11-07)
          SHA=$(sha256sum app/life-room.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"apk":"/app/life-room.apk","sha256":"%s"}\n' "$GITHUB_RUN_NUMBER" "$SHA" > app/version.json
          git config user.name "life-room-bot"
          git config user.email "life-room-bot@users.noreply.github.com"
          git add -f app
          git commit -m "앱 새 버전 올림 (${GITHUB_RUN_NUMBER})"
          git pull --rebase -q origin main
          git push origin HEAD:main
